    <script>
        (function () {
            const root = document.documentElement;
            const themeKeys = {
                theme_bg: '--bg-body',
                theme_sidebar: '--dark',
                theme_navbar: '--navbar-bg',
                theme_card: '--card-bg',
                theme_table: '--table-head',
                theme_text: '--text-color',
                theme_primary: '--primary'
            };

            const hexToRgb = (hex) => {
                if (!hex) return null;
                let value = hex.replace('#', '').trim();
                if (value.length === 3) {
                    value = value.split('').map((char) => char + char).join('');
                }
                if (value.length !== 6) return null;

                const int = parseInt(value, 16);
                return {
                    r: (int >> 16) & 255,
                    g: (int >> 8) & 255,
                    b: int & 255
                };
            };

            Object.entries(themeKeys).forEach(([key, cssVar]) => {
                const value = localStorage.getItem(key);
                if (value) {
                    root.style.setProperty(cssVar, value);
                }
            });

            const primaryColor = localStorage.getItem('theme_primary') || getComputedStyle(root).getPropertyValue('--primary').trim();
            const rgb = hexToRgb(primaryColor);
            if (rgb) {
                root.style.setProperty('--primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
            }

            const sidebarWidth = parseInt(localStorage.getItem('theme_sidebar_width') || '68', 10);
            const sidebarHover = parseInt(localStorage.getItem('theme_sidebar_hover') || '228', 10);
            const cardRadius = parseInt(localStorage.getItem('theme_card_radius') || '18', 10);
            const contentWidth = parseInt(localStorage.getItem('theme_content_width') || '1320', 10);
            const shadowLevel = localStorage.getItem('theme_shadow_level') || 'medium';
            const density = localStorage.getItem('theme_density') || 'comfortable';
            const headerMode = localStorage.getItem('theme_header_mode') || 'solid';
            const sidebarStyle = localStorage.getItem('theme_sidebar_style') || 'solid';
            const containerMode = localStorage.getItem('theme_container_mode') || 'fluid';

            const shadowMap = {
                soft: '0 10px 22px rgba(15, 23, 42, 0.06)',
                medium: '0 16px 32px rgba(15, 23, 42, 0.08)',
                strong: '0 24px 48px rgba(15, 23, 42, 0.12)'
            };

            root.style.setProperty('--sidebar-width', `${sidebarWidth}px`);
            root.style.setProperty('--sidebar-hover', `${Math.max(sidebarHover, sidebarWidth + 80)}px`);
            root.style.setProperty('--card-radius', `${cardRadius}px`);
            root.style.setProperty('--content-max-width', `${contentWidth}px`);
            root.style.setProperty('--card-shadow', shadowMap[shadowLevel] || shadowMap.medium);

            root.dataset.density = density;
            root.dataset.headerMode = headerMode;
            root.dataset.sidebarStyle = sidebarStyle;
            root.dataset.containerMode = containerMode;
        })();
    </script>
</head>
