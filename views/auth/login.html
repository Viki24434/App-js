<div style="max-width: 400px; margin: 80px auto; padding: 40px; background: var(--card-bg); border-radius: var(--card-radius); box-shadow: var(--card-shadow); border: 1px solid var(--border-color);">
    <div style="text-align: center; margin-bottom: 30px;">
        <div style="width: 70px; height: 70px; background: rgba(var(--primary-rgb), 0.1); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 15px;">
            <i class="fas fa-print fa-2x" style="color: var(--primary);"></i>
        </div>
        <h2 style="margin: 0; color: var(--header-text-color);">Selamat Datang</h2>
        <p style="color: var(--muted); font-size: 13px; margin-top: 5px;">Silakan login ke POS Percetakan</p>
    </div>
    
    <div id="login-error" style="display: none; background: #fee2e2; color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; text-align: center; border: 1px solid #fca5a5;"></div>

    <form id="form-login">
        <div class="form-group" style="margin-bottom: 18px;">
            <label style="color: var(--text-color);">Username</label>
            <input type="text" id="login-username" required placeholder="Masukkan username" style="padding: 12px;">
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
            <label style="color: var(--text-color);">Password</label>
            <input type="password" id="login-password" required placeholder="Masukkan password" style="padding: 12px;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px; background: var(--primary);">
            <i class="fas fa-sign-in-alt"></i> Masuk Sekarang
        </button>
    </form>
</div>
