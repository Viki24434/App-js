<div style="max-width: 450px; margin: 80px auto; padding: 40px; background: #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;">
    <i class="fas fa-lock fa-3x" style="color: #ef4444; margin-bottom: 20px;"></i>
    <h2 style="margin: 0;">Aktivasi Perangkat</h2>
    <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">Aplikasi ini mendeteksi perangkat baru. Silakan masukkan kunci aktivasi untuk komputer ini.</p>
    
    <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <small style="color: #64748b; display: block;">Device ID Anda:</small>
        <strong id="display-device-id" style="font-size: 18px; color: #0f172a; letter-spacing: 2px;">MEMUAT...</strong>
    </div>

    <form id="form-activation">
        <input type="text" id="license-key" required placeholder="Masukkan Kunci Lisensi..." style="width: 100%; padding: 12px; margin-bottom: 15px; text-align: center; font-weight: bold; font-size: 16px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 15px;">Aktivasi Sekarang</button>
    </form>
</div>
