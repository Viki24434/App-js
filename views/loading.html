<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Optik - Startup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
        }

        /* Container utama Splash Screen (Layout Horizontal) */
        .splash-container {
            width: 600px;
            height: 320px;
            background: #060910; /* Ultra Dark Blue */
            border-radius: 16px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            overflow: hidden;
        }

        /* Efek Lampu Sorot di Background (Sangat Photoshop) */
        .splash-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
            animation: spotlight 6s linear infinite;
            z-index: 1;
        }

        /* Bagian Kiri: Logo & Animasi Aperture Lensa */
        .brand-section {
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            border-right: 1px solid rgba(255,255,255,0.03);
            background: rgba(0,0,0,0.2);
        }

        .aperture-loader {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        /* Multi-ring orbital (Aperture Optik) */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: spin linear infinite;
        }

        .ring-1 { inset: 0; border-top-color: #3b82f6; animation-duration: 1s; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .ring-2 { inset: 10px; border-right-color: #8b5cf6; animation-duration: 1.5s; animation-direction: reverse; }
        .ring-3 { inset: 20px; border-bottom-color: #06b6d4; animation-duration: 2s; }
        
        .ring-core {
            position: absolute;
            inset: 35px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.8);
            animation: pulse 1s ease-in-out infinite alternate;
        }

        /* Bagian Kanan: Info & Progress */
        .info-section {
            width: 60%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 2;
            box-sizing: border-box;
        }

        .text-group h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .text-group h1 span {
            background: linear-gradient(to right, #60a5fa, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .version-tag {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            display: block;
        }

        /* Area Progress (Paling Bawah bagian Info) */
        .progress-area {
            margin-top: auto;
        }

        /* Bar Progress Tipis & Modern (Sifat PS) */
        .progress-bar-container {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%; /* Diatur via JS */
            background: linear-gradient(to right, #3b82f6, #06b6d4);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            transition: width 0.3s ease;
        }

        /* Teks Status Dinamis */
        #loading-text {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Footer (Teks Hak Cipta & Credits Berjalan - FITUR UTAMA PS) */
        .splash-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 3;
        }

        .copyright {
            font-size: 9px;
            color: #475569;
        }

        /* Container Credits Berjalan */
        .credits-container {
            width: 250px;
            height: 100%;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        .credits-track {
            display: flex;
            position: absolute;
            white-space: nowrap;
            animation: scrollCredits 15s linear infinite;
        }

        .credits-track span {
            font-size: 9px;
            color: #64748b;
            margin-right: 30px;
        }

        /* KEYFRAMES ANIMASI */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }
        @keyframes spotlight { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes scrollCredits { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }

    </style>
</head>
<body>
    
    <div class="splash-container">
        
        <div class="brand-section">
            <div class="aperture-loader">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="ring-core"></div>
            </div>
        </div>

        <div class="info-section">
            <div class="text-group">
                <h1>Sistem Kasir<br><span>Optik Digital</span></h1>
                <span class="version-tag">Versi 2026.1 "Helios"</span>
            </div>

            <div class="progress-area">
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
                <p id="loading-text">Menginisialisasi core engine...</p>
            </div>
        </div>

        <div class="splash-footer">
            <div class="copyright">&copy; 2024 Percetakan Digital Solutions</div>
            
            <div class="credits-container">
                <div class="credits-track">
                    <span>Dev: Gibran AI</span>
                    <span>UI: Premium Dark Theme</span>
                    <span>Engine: Node.js/Electron</span>
                    <span>DB: MariaDB Portable</span>
                    <span>Aperture Module Loaded</span>
                    <span>Initializing Optic Handlers</span>
                    <span>Rendering POS Interface</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
