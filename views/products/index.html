<style>
    .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 20px; }
    .header-action:first-child { margin-top: 0; }
    .header-text h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--header-text-color); display: flex; align-items: center; gap: 10px; }
    
    .table-responsive { width: 100%; overflow-x: auto; }
    .table-modern { width: 100%; border-collapse: collapse; }
    .table-modern th { background: var(--table-head); padding: 14px 16px; text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; border-bottom: 2px solid var(--border-color); }
    .table-modern td { padding: 14px 16px; border-bottom: 1px solid rgba(226, 232, 240, 0.5); font-size: 13px; vertical-align: middle; color: var(--text-color); }
    .table-modern tbody tr:nth-child(even) td { background: #f8fafc; }
    .table-modern tbody tr:hover td { background: #f1f5f9; }
    
    .action-group { display: flex; gap: 8px; justify-content: center; }
    .btn-icon { width: 34px; height: 34px; border-radius: 10px; border: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #fff; }
    .btn-icon:hover { transform: translateY(-2px); }
    
    .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    
    @media (max-width: 960px) { .grid-layout { grid-template-columns: 1fr; } }
</style>

<div class="header-action">
    <div class="header-text">
        <h2><i class="fas fa-box" style="color: var(--primary);"></i> Manajemen Produk</h2>
    </div>
    <button class="btn btn-success" onclick="window.openProductModal()" style="height: 42px; padding: 0 20px;">
        <i class="fas fa-plus"></i> Tambah Produk
    </button>
</div>

<div class="card" style="margin-bottom: 30px;">
    <div style="margin-bottom: 15px; max-width: 300px;">
        <input type="text" id="product-search" placeholder="Cari nama produk atau kode..." onkeyup="window.filterProductTable()">
    </div>
    <div class="table-responsive">
        <table class="table-modern">
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Nama Produk</th>
                    <th>Kategori</th>
                    <th>Stok</th>
                    <th>Harga Jual</th>
                    <th style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="product-list-body">
                <tr><td colspan="6" style="text-align: center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="grid-layout">
    <div>
        <div class="header-action">
            <div class="header-text">
                <h2><i class="fas fa-tags" style="color: #f59e0b;"></i> Kategori</h2>
            </div>
            <button id="btn-add-category" class="btn btn-primary" style="height: 38px; padding: 0 15px;"><i class="fas fa-plus"></i> Tambah Kategori</button>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th style="width: 50px;">ID</th>
                            <th>Nama Kategori</th>
                            <th style="text-align: center; width: 80px;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="category-list-body">
                        <tr><td colspan="3" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div>
        <div class="header-action">
            <div class="header-text">
                <h2><i class="fas fa-ruler-combined" style="color: #10b981;"></i> Satuan</h2>
            </div>
            <button id="btn-add-unit" class="btn btn-primary" style="height: 38px; padding: 0 15px;"><i class="fas fa-plus"></i> Tambah Satuan</button>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th>Nama Satuan</th>
                            <th>Simbol</th>
                            <th style="text-align: center; width: 80px;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="unit-list-body">
                        <tr><td colspan="3" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="modal-add-product" class="modal-overlay">
    <div class="modal-box">
        <button class="modal-close" onclick="window.closeProductModal()"><i class="fas fa-times"></i></button>
        <h3 style="margin-top: 0; margin-bottom: 20px; color: var(--dark); font-size: 18px;"><i class="fas fa-box" style="color: var(--primary);"></i> Tambah Produk Baru</h3>
        
        <form id="form-modal-product">
            <input type="hidden" id="modal-prod-id" value="">
            <input type="hidden" id="modal-prod-current-img" value="">
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Kode Produk</label>
                    <input type="text" id="modal-prod-code" placeholder="Otomatis jika kosong">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Nama Produk <span style="color:red;">*</span></label>
                    <input type="text" id="modal-prod-name" required>
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Kategori</label>
                    <select id="modal-prod-category"><option value="">Pilih...</option></select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Satuan</label>
                    <select id="modal-prod-unit"><option value="">Pilih...</option></select>
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Harga Jual (Rp) <span style="color:red;">*</span></label>
                    <input type="number" id="modal-prod-price" required min="0">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Stok Awal</label>
                    <input type="number" id="modal-prod-stock" value="0" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Gambar Produk</label>
                <input type="file" id="modal-prod-img" accept="image/*">
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; margin-top: 15px; height: 45px; font-size: 14px;">
                Simpan Produk
            </button>
        </form>
    </div>
</div>

<div id="modal-category" class="modal-overlay">
    <div class="modal-box" style="max-width: 400px;">
        <button class="modal-close" onclick="window.closeCategoryModal()"><i class="fas fa-times"></i></button>
        <h3 style="margin-top:0; margin-bottom:12px;">Kategori</h3>
        <form id="form-modal-category">
            <input type="hidden" id="modal-cat-id" value="">
            <div class="form-group">
                <label>Nama Kategori</label>
                <input type="text" id="modal-cat-name" required>
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button type="submit" class="btn btn-success">Simpan</button>
                <button type="button" class="btn btn-secondary" onclick="window.closeCategoryModal()">Batal</button>
            </div>
        </form>
    </div>
</div>

<div id="modal-unit" class="modal-overlay">
    <div class="modal-box" style="max-width: 400px;">
        <button class="modal-close" onclick="window.closeUnitModal()"><i class="fas fa-times"></i></button>
        <h3 style="margin-top:0; margin-bottom:12px;">Satuan</h3>
        <form id="form-modal-unit">
            <input type="hidden" id="modal-unit-id" value="">
            <div class="form-group">
                <label>Nama Satuan</label>
                <input type="text" id="modal-unit-name" required>
            </div>
            <div class="form-group">
                <label>Simbol</label>
                <input type="text" id="modal-unit-symbol">
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button type="submit" class="btn btn-success">Simpan</button>
                <button type="button" class="btn btn-secondary" onclick="window.closeUnitModal()">Batal</button>
            </div>
        </form>
    </div>
</div>

<div id="modal-confirm" class="modal-overlay">
    <div class="modal-box" style="max-width: 400px;">
        <h3 id="confirm-title" style="margin-top:0; margin-bottom:12px;">Konfirmasi</h3>
        <p id="confirm-message">Yakin?</p>
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button id="confirm-yes" class="btn btn-danger">Ya</button>
            <button id="confirm-no" class="btn btn-secondary" onclick="document.getElementById('modal-confirm').classList.remove('active')">Tidak</button>
        </div>
    </div>
</div>
