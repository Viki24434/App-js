<div style="margin-bottom: 20px;">
    <h2><i class="fas fa-cogs"></i> Pengaturan Toko</h2>
</div>
<div class="card" style="max-width: 700px;">
    <form id="form-settings">
        <div class="form-group">
            <label>Nama Toko / Percetakan</label>
            <input type="text" id="setting-store-name" required>
        </div>
        <div class="form-group">
            <label>No. Telepon / WhatsApp</label>
            <input type="text" id="setting-store-phone">
        </div>
        <div class="form-group">
            <label>Alamat Lengkap</label>
            <textarea id="setting-store-address" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Catatan Kaki Struk (Footer)</label>
            <textarea id="setting-store-footer" rows="2" placeholder="Contoh: Terima kasih telah berbelanja!"></textarea>
        </div>
        <button type="submit" class="btn btn-success" style="padding: 12px 20px; margin-top: 10px;">
            <i class="fas fa-save"></i> Simpan Pengaturan
        </button>
    </form>
</div>
