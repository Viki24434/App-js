<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisensi Generator (Developer Only)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 40px; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 400px; text-align: center; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; text-align: center; font-weight: bold; font-family: monospace; box-sizing: border-box;}
        button { width: 100%; padding: 15px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #059669; }
        .result-box { margin-top: 25px; padding: 20px; background: rgba(56, 189, 248, 0.1); border: 1px dashed #38bdf8; border-radius: 8px; }
        .result-text { font-size: 22px; font-weight: bold; color: #38bdf8; letter-spacing: 2px; user-select: all; cursor: pointer;}
    </style>
</head>
<body>

    <div class="box">
        <h2>🔑 POS Keygen</h2>
        <p style="font-size: 13px; color: #94a3b8;">Masukkan Device ID Pelanggan untuk membuat Kode Lisensi Resmi.</p>
        
        <input type="text" id="inputId" placeholder="Paste Device ID di sini..." autocomplete="off">
        <button onclick="generateLicense()">Generate Kunci Lisensi</button>

        <div class="result-box">
            <span style="font-size: 12px; color: #94a3b8; display:block; margin-bottom: 5px;">Lisensi Resmi untuk Pelanggan:</span>
            <div id="outputLicense" class="result-text">----</div>
        </div>
    </div>

    <script>
        const SECRET_SALT = "RAHASIA_TOKO_SAYA_2026!";

        async function generateLicense() {
            const deviceId = document.getElementById('inputId').value.trim();
            if (!deviceId) return alert("Device ID tidak boleh kosong!");

            const textToHash = deviceId + SECRET_SALT;
            
            const msgBuffer = new TextEncoder().encode(textToHash);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();

            const license = `${hashHex.substring(0,4)}-${hashHex.substring(4,8)}-${hashHex.substring(8,12)}-${hashHex.substring(12,16)}`;
            
            document.getElementById('outputLicense').innerText = license;
        }
    </script>
</body>
</html>
